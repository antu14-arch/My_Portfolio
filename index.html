<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antu | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     font-family: 'Poppins', sans-serif;
    }

    body {
     /* Dynamic Gradient Background */
     background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
     background-attachment: fixed;
     color: #ffffff;
     min-height: 100vh;
     display: flex;
     flex-direction: column;
     justify-content: space-between;
     align-items: center;
     text-align: center;
     padding: 40px 20px;
    }

    .container {
     max-width: 800px;
     margin: auto;
     background: rgba(255, 255, 255, 0.05);
     backdrop-filter: blur(10px);
     border: 1px solid rgba(255, 255, 255, 0.1);
     border-radius: 20px;
     padding: 40px 30px;
     box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .profile-img {
     width: 150px;
     height: 150px;
     border-radius: 50%;
     object-fit: cover;
     border: 4px solid #ec4899;
     box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
     margin-bottom: 20px;
    }

    h1 {
     font-size: 2.5rem;
     font-weight: 700;
     margin-bottom: 10px;
     background: linear-gradient(to right, #38bdf8, #ec4899);
     -webkit-background-clip: text;
     -webkit-text-fill-color: transparent;
    }

    p.bio {
     font-size: 1.1rem;
     color: #cbd5e1;
     margin-bottom: 25px;
     line-height: 1.6;
    }

    .tags {
     display: flex;
     justify-content: center;
     gap: 10px;
     flex-wrap: wrap;
     margin-bottom: 30px;
    }

    .tag {
     background: rgba(255, 255, 255, 0.1);
     padding: 8px 16px;
     border-radius: 20px;
     font-size: 0.9rem;
     color: #38bdf8;
     border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn {
     display: inline-block;
     padding: 12px 30px;
     background: linear-gradient(135deg, #ec4899, #8b5cf6);
     color: #ffffff;
     text-decoration: none;
     font-weight: 600;
     border-radius: 30px;
     transition: all 0.3s ease;
     box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
    }

    .btn:hover {
     transform: translateY(-3px);
     box-shadow: 0 15px 25px rgba(236, 72, 153, 0.5);
    }

    footer {
     margin-top: 40px;
     font-size: 0.85rem;
     color: #64748b;
    }
</style>
</head>
<body>

<div class="container">
    <img src="watermarked_img_11845167592478474664.png" alt="Antu Profile" class="profile-img">

    <h1>Antu</h1>

    <p class="bio">
     Sports Management Enthusiast & B2B Consultant | Driven by analytics, strategy, and creative execution.
    </p>

    <div class="tags">
     <span class="tag">Sports Administration</span>
     <span class="tag">B2B Strategy</span>
     <span class="tag">Digital Visuals</span>
    </div>

    <a href="mailto:your-email@gmail.com" class="btn">Get In Touch</a>
</div>

<footer>
    &copy; 2026 Antu. All Rights Reserved.
</footer>

</body>
</html>
